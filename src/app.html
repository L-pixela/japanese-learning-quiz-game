<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply the stored theme and language before first paint so the page
			// never flashes the wrong one.
			try {
				var t = localStorage.getItem('tantore-theme')
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
				var l = localStorage.getItem('tantore-lang')
				if (l === 'ja' || l === 'en') document.documentElement.lang = l
			} catch (e) {
				/* localStorage may be unavailable (e.g. privacy mode) — fall back to default theme/lang */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
