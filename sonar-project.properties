sonar.projectKey=L-pixela_japanese-learning-quiz-game
sonar.organization=l-pixela


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=japanese-learning-quiz-game
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.spec.ts,src/**/*.svelte.test.ts,src/**/*.svelte.spec.ts,src/**/*.e2e.ts
sonar.exclusions=src/lib/vitest-examples/**,src/**/*.d.ts,src/lib/server/db/mock-db.ts,src/lib/server/db/test-d1.ts

# Coverage report produced by `pnpm test:unit -- --run --coverage` (vitest + @vitest/coverage-v8).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# +page.svelte / +layout.svelte route files are excluded from Vitest coverage
# (see vite.config.ts test.coverage.exclude) — excluded here too so Sonar
# doesn't treat them as untested code and fail the Quality Gate.
sonar.coverage.exclusions=src/routes/**/+*.svelte,src/lib/i18n/dictionary.ts,src/lib/team.ts,src/lib/mock-data/decks.ts

# Repeated records are content, not duplicated behavior.
sonar.cpd.exclusions=src/lib/i18n/dictionary.ts,src/lib/team.ts

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
